plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
	id "org.jetbrains.kotlin.jvm" version "2.4.10"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.

	// Sodium's public config API (net.caffeinemc.mods.sodium.api.config)
	maven {
		name = "CaffeineMC"
		url = uri("https://maven.caffeinemc.net/releases")
	}

	// Mod Menu (com.terraformersmc:modmenu)
	maven {
		name = "TerraformersMC"
		url = uri("https://maven.terraformersmc.com/")
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"sodium_plugin" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	modImplementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"

	// Sodium's public config API. Compile-only: the actual classes are provided at runtime by Sodium itself.
	// This lets us register our own page into Sodium's Video Settings screen (the "sodium:config_api_user" entrypoint).
	modCompileOnly "net.caffeinemc:sodium-fabric-api:0.8.0+mc1.21.11"

	// Mod Menu API. Compile-only: only needed to register a config-screen entry in Mod Menu's mod list.
	// The actual mod is provided at runtime by the user's Mod Menu installation.
	modCompileOnly "com.terraformersmc:modmenu:17.0.0"
}

// ---------------------------------------------------------------------------
// 编译期桩类（stubs）
//
// 本环境的 loom（1.14.10）在 1.21.11 下提供的 minecraft 拆分 jar 缺少
// com.mojang.blaze3d.vertex.PoseStack 与 net.minecraft.entity.player.Player 等类，
// 而 Mixin 的 @Redirect 处理器方法签名需要引用这些类型。
// 这些桩类只参与 javac 编译（编译到 build/stubs-classes），绝不打包进 mod jar；
// 运行时由游戏自带的真实类加载并遮蔽，不产生任何冲突。
// ---------------------------------------------------------------------------
def stubClassesDir = file("build/stubs-classes")

tasks.register("compileStubs", JavaCompile) {
	source fileTree("stubs")
	include "**/*.java"
	destinationDirectory.set(stubClassesDir)
	// joml 提供 org.joml.Quaternionfc（桩 PoseStack.mulPose 参数所需）；其余类型均为桩自身。
	classpath = configurations.detachedConfiguration(
			dependencies.create("org.joml:joml:1.10.8")
	)
	options.release = 21
	options.encoding = "UTF-8"
}

// 让 client 源集的 Java/Kotlin 编译都能看到桩类，并在编译前先生成桩类。
sourceSets.client.compileClasspath += files(stubClassesDir)
tasks.named("compileClientJava") {
	dependsOn "compileStubs"
}
tasks.named("compileClientKotlin") {
	dependsOn "compileStubs"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).all {
	kotlinOptions {
		jvmTarget = 21
	}
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
