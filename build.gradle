plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
	id "org.jetbrains.kotlin.jvm" version "2.3.0"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = "CaffeineMC"
		url = uri("https://maven.caffeinemc.net/releases")
	}

	maven {
		name = "TerraformersMC"
		url = uri("https://maven.terraformersmc.com/")
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"warzoneutils" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	modImplementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"

	modCompileOnly "net.caffeinemc:sodium-fabric-api:0.8.0+mc1.21.11"

	modCompileOnly "com.terraformersmc:modmenu:17.0.0"
}

def stubClassesDir = file("build/stubs-classes")

tasks.register("compileStubs", JavaCompile) {
	source fileTree("stubs")
	include "**/*.java"
	destinationDirectory.set(stubClassesDir)
	classpath = configurations.detachedConfiguration(
			dependencies.create("org.joml:joml:1.10.8")
	)
	options.release = 21
	options.encoding = "UTF-8"
}

sourceSets.client.compileClasspath += files(stubClassesDir)
tasks.named("compileClientJava") {
	dependsOn "compileStubs"
}
tasks.named("compileClientKotlin") {
	dependsOn "compileStubs"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).all {
	kotlinOptions {
		jvmTarget = 21
	}
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

tasks.register("validateLangJson") {
	doLast {
		def slurper = new groovy.json.JsonSlurper()
		fileTree("src/client/resources/assets") {
			include "**/lang/*.json"
		}.each { f ->
			try {
				slurper.parseText(f.getText("UTF-8"))
			} catch (Exception e) {
				throw new GradleException("Invalid lang JSON: ${f.name} -> ${e.message}")
			}
		}
	}
}

["processResources", "processClientResources"].each { taskName ->
	tasks.matching { it.name == taskName }.configureEach {
		dependsOn "validateLangJson"
	}
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}
